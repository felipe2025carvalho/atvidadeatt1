<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coordenadas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Coordenadas do Plano Cartesiano</h1>
    <p>Descubra em qual quadrante ou eixo o ponto se encontra</p>

    <div>
        <label for="x">Valor de X:</label>
        <input type="number" id="x" placeholder="Digite o valor de X">

        <label for="y">Valor de Y:</label>
        <input type="number" id="y" placeholder="Digite o valor de Y">
    </div>

    <button>Verificar Posição</button>

    <p id="resultado"></p>

    <script src="script.js"></script>
</body>
</html>
